<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="popupTitle">yt-tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="header-icon" src="icons/icon48.png" alt="" />
    <div class="header-copy">
      <div class="header-title">yt-tools</div>
      <div class="header-subtitle" data-i18n="headerSubtitle">YouTube viewing tools</div>
    </div>
  </header>

  <main>
    <div class="section-heading" data-i18n="featuresHeading">Features</div>

    <section class="feature-card active" id="statusCard">
      <div class="feature-copy">
        <div class="feature-heading">
          <h2 data-i18n="miniplayerTitle">Miniplayer button</h2>
          <span class="status-badge" id="statusText">On</span>
        </div>
        <p data-i18n="miniplayerDescription">Adds a miniplayer button to the YouTube player.</p>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggle" checked />
        <span class="toggle-track"></span>
        <span class="toggle-thumb"></span>
      </label>
    </section>

    <section class="feature-card" id="shortsCard">
      <div class="feature-copy">
        <div class="feature-heading">
          <h2 data-i18n="shortsTitle">Hide Shorts</h2>
          <span class="status-badge off" id="shortsText">Off</span>
        </div>
        <p data-i18n="shortsDescription">Hides Shorts and opens their links in the standard player.</p>
      </div>
      <label class="toggle">
        <input type="checkbox" id="shortsToggle" />
        <span class="toggle-track"></span>
        <span class="toggle-thumb"></span>
      </label>
    </section>

    <section class="feature-card" id="playablesCard">
      <div class="feature-copy">
        <div class="feature-heading">
          <h2 data-i18n="playablesTitle">Hide Playables</h2>
          <span class="status-badge off" id="playablesText">Off</span>
        </div>
        <p data-i18n="playablesDescription">Hides Playables and blocks their pages.</p>
      </div>
      <label class="toggle">
        <input type="checkbox" id="playablesToggle" />
        <span class="toggle-track"></span>
        <span class="toggle-thumb"></span>
      </label>
    </section>
  </main>

  <footer class="footer">
    <span class="local-note" data-i18n="localSettingsNote">Settings stay on this device.</span>
    <a class="github-link" href="https://github.com/fjt-dev/yt-tools" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
          .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
          .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span data-i18n="githubLink">GitHub</span>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
